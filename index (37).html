<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catatku — Keuangan Pribadi</title>
  <meta name="description" content="Catat pemasukan dan pengeluaran langsung ke Google Sheets.">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Catatku">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <!-- Layar utama aplikasi -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div>
        <p class="topbar-sub" id="topbarSub">Halo 👋</p>
        <h1 class="topbar-title" id="topbarTitle">Beranda</h1>
      </div>
      <button class="icon-btn" id="btnRefresh" aria-label="Muat ulang data">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </header>

    <div class="sync-pill" id="syncPill" hidden></div>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <button class="nav-item active" data-route="home" aria-label="Beranda">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Beranda</span>
      </button>
      <button class="nav-item" data-route="riwayat" aria-label="Riwayat">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Riwayat</span>
      </button>
      <button class="fab" id="fabAdd" aria-label="Tambah transaksi">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="nav-item" data-route="analisis" aria-label="Analisis">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Analisis</span>
      </button>
      <button class="nav-item" data-route="setelan" aria-label="Setelan">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Setelan</span>
      </button>
    </nav>
  </div>

  <!-- Layar penghubung pertama kali -->
  <section id="setup" class="setup" hidden></section>

  <!-- Layar kunci PIN -->
  <section id="lock" class="lock" hidden></section>

  <div id="sheets"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>Aktifkan JavaScript untuk memakai Catatku.</noscript>
  <script src="./app.js"></script>
</body>
</html>
